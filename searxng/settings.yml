---
# SearXNG settings for the NarnixVPN AI backend.
# Mounted read-only into the docker-compose `searxng` service (compose network
# only — never publicly exposed). JSON is the only format the backend uses.
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0:8080"
  base_url: http://0.0.0.0:8080
  secret_key: searxng-narnix-backend

formats:
  - html
  - json

search:
  safe_search: 1
  default_http_method: GET

# Private instance on a trusted network: the per-IP limiter would make
# compose's shared container address self-throttle, so it is disabled.
limiter:
  enabled: false
